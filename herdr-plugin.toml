id = "structupath.conductor"
name = "Conductor"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Orchestrate a feature-delivery team as visible Herdr agent panes — dispatch worker agents, watch a live board, stand down cleanly"
platforms = ["macos", "linux"]

# The orchestrating AGENT drives dispatch by sourcing scripts/conductor-lib.sh
# (the transport, proven on herdr 0.7.5). These actions are the operational surface
# around a run: stand the team up, watch it, harvest it, stand it down. Plugin
# actions get no argv/TTY, so dispatch itself stays agent-driven — a team is
# declared once in the workspace's .herdr-conductor.json and assembled from there.

[[actions]]
id = "assemble"
title = "Assemble the team"
description = "Stand up every role in the workspace's .herdr-conductor.json — worktrees, guard drops, one agent pane each — then open the board"
command = ["bash", "scripts/assemble.sh"]

[[actions]]
id = "board"
title = "Open the Conductor board"
description = "Live pane: one row per worker (role, kind, pane, state, cwd) for the active run"
command = ["bash", "scripts/board.sh"]

[[actions]]
id = "status"
title = "Status of the run"
description = "One-shot table: role, kind, pane, live agent state, cwd — the board's answer without a pane"
command = ["bash", "scripts/status.sh"]

[[actions]]
id = "harvest"
title = "Harvest the run"
description = "Merge every writing role's branch into one integration worktree; conflicts are reported, never forced"
command = ["bash", "scripts/harvest.sh"]

[[actions]]
id = "stand-down"
title = "Stand down the team"
description = "Close every conductor-owned worker pane for this run; git branches are kept"
command = ["bash", "scripts/stand-down.sh"]

# Pane title doubles as the cleanup sweep label (pane list reports it as
# "label") — keep it distinctive so a sweep can never match a user pane.

[[panes]]
id = "board-pane"
title = "Conductor Board"
placement = "split"
command = ["bash", "scripts/board-pane.sh"]
