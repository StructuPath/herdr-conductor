id = "structupath.conductor"
name = "Conductor"
version = "0.3.0"
min_herdr_version = "0.7.5"
description = "Stage 2 attended strict task/report contracts and exact-SHA review gates for Herdr 0.7.5"
platforms = ["macos", "linux"]

# Exactly five attended actions share one strict context-bound runtime authority.
# Herdr actions receive no arguments. Configuration v2 contains no launch
# arguments; task authority is durable before any pane or agent starts.

[[actions]]
id = "assemble"
title = "Assemble the team"
description = "Publish strict producer tasks and private report outboxes before creating task-bound panes and agents"
command = ["bash", "scripts/assemble.sh"]

[[actions]]
id = "board"
title = "Snapshot Conductor status"
description = "Print one passive lifecycle snapshot for the invoking physical repository and Herdr workspace"
command = ["bash", "scripts/board.sh"]

[[actions]]
id = "status"
title = "Status of the run"
description = "Print context-bound task, report, integration, gate, and exact live identity status"
command = ["bash", "scripts/status.sh"]

[[actions]]
id = "harvest"
title = "Harvest the run"
description = "Attended report collection, complete deterministic one-CAS integration, and exact-SHA gate dispatch"
command = ["bash", "scripts/harvest.sh"]

[[actions]]
id = "preview"
title = "Preview the apply"
description = "Journal one zero-effect Stage 3 apply preview binding the exact integration, gate reports, and configured apply target ref"
command = ["bash", "scripts/preview.sh"]

[[actions]]
id = "apply"
title = "Apply the approved run"
description = "Consume the recorded approve receipt exactly once and move the configured apply ref with exactly zero or one compare-and-swap"
command = ["bash", "scripts/apply.sh"]

[[actions]]
id = "stand-down"
title = "Stand down the team"
description = "Archive strict state and close only panes matching the deterministic full live recorded identity tuple"
command = ["bash", "scripts/stand-down.sh"]

# The single board pane remains passive. It neither launches a mission nor
# creates, harvests, closes, applies, or cleans any product resource.

[[panes]]
id = "board-pane"
title = "Conductor Board"
placement = "split"
command = ["bash", "scripts/board-pane.sh"]
