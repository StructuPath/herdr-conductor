id = "structupath.conductor"
name = "Conductor"
version = "0.2.0"
min_herdr_version = "0.7.5"
description = "Stage 1 attended operations with strict context-bound assembly, identity-checked reconciliation, and archival pane close"
platforms = ["macos", "linux"]

# Stage 1 B4-verified actions use one strict context-bound JSON authority. Dispatch/report,
# suite adapter, and approval contracts remain held for Stage 2+. Plugin actions receive no argv/TTY, so the team is declared in
# the invoking repository's .herdr-conductor.json.

[[actions]]
id = "assemble"
title = "Assemble the team"
description = "Create a strict context-bound run from one fixed fork, wait through explicit pane-busy refusal, and journal exact role worktree, pane, and agent identity"
command = ["bash", "scripts/assemble.sh"]

[[actions]]
id = "board"
title = "Snapshot Conductor status"
description = "Print one live JSON status snapshot for the invoking repository and Herdr workspace only"
command = ["bash", "scripts/board.sh"]

[[actions]]
id = "status"
title = "Status of the run"
description = "Print context-bound live status after comparing exact recorded and observed agent identity"
command = ["bash", "scripts/status.sh"]

[[actions]]
id = "harvest"
title = "Harvest the run"
description = "Attended reconcile after live source and integration-target Git identity checks under one repository lock"
command = ["bash", "scripts/harvest.sh"]

[[actions]]
id = "stand-down"
title = "Stand down the team"
description = "Archive strict state and close only panes matching the full live recorded identity tuple"
command = ["bash", "scripts/stand-down.sh"]

# The pane entrypoint is a passive strict-state renderer. The board action does
# not open or focus panes because that mutation is held until identity is journaled.

[[panes]]
id = "board-pane"
title = "Conductor Board"
placement = "split"
command = ["bash", "scripts/board-pane.sh"]
