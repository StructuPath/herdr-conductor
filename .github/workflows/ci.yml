---
name: CI

"on":
  pull_request:
  push:

permissions:
  contents: read

jobs:
  node-linux:
    name: Linux / Node ${{ matrix.node-version }} / full history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - lts/*
    steps:
      - name: Check out complete candidate history
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Prove checkout is not shallow
        run: test "$(git rev-parse --is-shallow-repository)" = false
      - name: Set up Node.js
        # v4.0.3
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node-version }}
      - name: Compile descriptor-held Python helper
        run: npm run check:python
      - name: Run complete candidate checks
        env:
          CONDUCTOR_TEST_BASH: /bin/bash
        run: npm run check
      - name: Run explicit Stage 2 matrix
        env:
          CONDUCTOR_TEST_BASH: /bin/bash
        run: npm run test:stage2

  macos-bash:
    name: macOS / Node 20 / system Bash 3.2 / real worktrees
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete candidate history
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Prove checkout is not shallow
        run: test "$(git rev-parse --is-shallow-repository)" = false
      - name: Set up Node.js 20
        # v4.0.3
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: 20
      - name: Require macOS system Bash 3.2
        run: |
          version="$(
            /bin/bash -c \
              'printf "%s.%s" "${BASH_VERSINFO[0]}" "${BASH_VERSINFO[1]}"'
          )"
          test "$version" = "3.2"
          /bin/bash -n scripts/*.sh
      - name: Compile descriptor-held Python helper
        run: npm run check:python
      - name: Run complete checks through system Bash
        env:
          CONDUCTOR_TEST_BASH: /bin/bash
        run: npm run check
      - name: Run explicit Stage 2 concurrency and SIGKILL matrix
        env:
          CONDUCTOR_TEST_BASH: /bin/bash
        run: npm run test:stage2

  static:
    name: ShellCheck / docs / manifest / evidence / Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete candidate history
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Prove checkout is not shallow
        run: test "$(git rev-parse --is-shallow-repository)" = false
      - name: Set up Node.js 20
        # v4.0.3
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: 20
      - name: Validate Bash syntax
        run: npm run check:shell
      - name: Run hosted ShellCheck
        run: |
          shellcheck --version
          npm run check:shellcheck
      - name: Validate Python helper
        run: npm run check:python
      - name: Validate manifest, documentation, and retained evidence
        run: |
          npm run check:manifest
          npm run check:docs
          npm run check:evidence
      - name: Validate workflow syntax with pinned Actionlint
        run: npm run check:workflow
